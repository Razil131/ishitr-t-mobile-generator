<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор времени</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: rgb(0,0,0);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }
        .container {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 36px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }
        .time-block { text-align: center; margin-bottom: 28px; }
        .label {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
            margin-bottom: 8px;
        }
        .virtual-time {
            font-size: 2.6em;
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1.2;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            word-break: break-word;
        }
        .real-time {
            font-size: 1em;
            opacity: 0.75;
            margin-top: 10px;
        }
        .meta {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding: 14px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.95em;
        }
        .meta span b { color: #ffd54f; }
        .status-paused { color: #ff6b6b !important; }
        .status-running { color: #51cf66 !important; }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        button {
            padding: 12px 10px;
            border: none;
            border-radius: 10px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        button:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button.active {
            background: #ffd54f;
            color: #1e3c72;
            border-color: #ffd54f;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }
        .btn-pause {
            background: #51cf66;
            color: #fff;
            font-size: 1.05em;
            padding: 14px;
        }
        .btn-pause.paused { background: #ff6b6b; }
        .btn-pause:hover { filter: brightness(1.1); }
        .btn-reset { background: rgba(255, 107, 107, 0.2); color: #ff8787; border: 1px solid rgba(255, 107, 107, 0.3); }
        .btn-reset:hover { background: rgba(255, 107, 107, 0.35); }

        .custom-row {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            align-items: center;
        }
        .custom-row label { font-size: 0.9em; opacity: 0.85; }
        .custom-row input {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            font-size: 1em;
            text-align: center;
        }
        .custom-row input:focus { outline: none; border-color: #ffd54f; }
        .custom-row button { flex: 0 0 auto; padding: 10px 18px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="time-block">
            <div class="virtual-time" id="virtualTime">—</div>
            <div class="real-time">Реальное: <span id="realTime">—</span></div>
        </div>

        <div class="meta">
            <span>Скорость: <b id="multiplier">1x</b></span>
            <span>Статус: <b id="status" class="status-running">Идёт</b></span>
        </div>

        <div class="btn-group">
            <button onclick="accelerate(1, this)">1x</button>
            <button onclick="accelerate(10, this)">10x</button>
            <button onclick="accelerate(100, this)">100x</button>
            <button onclick="accelerate(1000, this)">1000x</button>
        </div>

        <div class="controls">
            <button class="btn-pause" id="pauseBtn" onclick="togglePause()">Пауза</button>
            <button class="btn-reset" onclick="resetTime()">Сброс</button>
        </div>

        <div class="custom-row">
            <label>Своя скорость:</label>
            <input type="number" id="customMultiplier" value="50" min="1">
            <button onclick="accelerateCustom()">OK</button>
        </div>
    </div>

    <script>
        const fmt = new Intl.DateTimeFormat('ru-RU', {
            day: '2-digit', month: 'long', year: 'numeric',
            hour: '2-digit', minute: '2-digit', second: '2-digit'
        });

        let currentMultiplier = 1;

        async function fetchStatus() {
            try {
                const res = await fetch('/api/v1/generator/time');
                const data = await res.json();

                document.getElementById('realTime').innerText = fmt.format(new Date(data.real_time));
                document.getElementById('virtualTime').innerText = fmt.format(new Date(data.virtual_time));
                document.getElementById('multiplier').innerText = data.multiplier + 'x';
                currentMultiplier = data.multiplier;

                const statusEl = document.getElementById('status');
                const pauseBtn = document.getElementById('pauseBtn');
                if (data.is_paused) {
                    statusEl.innerText = 'Пауза';
                    statusEl.className = 'status-paused';
                    pauseBtn.innerText = 'Продолжить';
                    pauseBtn.classList.add('paused');
                } else {
                    statusEl.innerText = 'Идёт';
                    statusEl.className = 'status-running';
                    pauseBtn.innerText = 'Пауза';
                    pauseBtn.classList.remove('paused');
                }
            } catch (e) {
                document.getElementById('virtualTime').innerText = 'Нет связи';
            }
        }

        async function sendCommand(endpoint, body = {}) {
            await fetch(`/api/v1/generator/time/${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            fetchStatus();
        }

        function accelerate(mult, btn) {
            sendCommand('accelerate', { multiplier: mult });
            document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }

        function accelerateCustom() {
            const val = parseInt(document.getElementById('customMultiplier').value);
            if (val >= 1) {
                sendCommand('accelerate', { multiplier: val });
                document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
            }
        }

        function togglePause() {
            const btn = document.getElementById('pauseBtn');
            if (btn.classList.contains('paused')) {
                sendCommand('resume');
            } else {
                sendCommand('pause');
            }
        }

        function resetTime() { sendCommand('reset'); }

        setInterval(fetchStatus, 1000);
        fetchStatus();
    </script>
</body>
</html>
